<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Reflectra</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <div class="auth-icon">✨</div>
                <h2>Create Your Account</h2>
                <p style="color:#666;">Start your emotional wellness journey today</p>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Choose a username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="your.email@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password"
                    oninput="checkStrength(this.value)">
                <div id="strength-bar" style="height:4px;border-radius:2px;background:#f0f0f0;margin-top:0.5rem;overflow:hidden;">
                    <div id="strength-fill" style="height:100%;width:0%;transition:width 0.3s,background 0.3s;border-radius:2px;"></div>
                </div>
                <small id="strength-label" style="color:#666;font-size:0.8rem;"></small>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" placeholder="Re-enter your password" required autocomplete="new-password">
            </div>

            <button type="button" onclick="handleRegister()" class="btn btn-primary" style="width:100%;margin-top:1rem;">
                Create Account 🚀
            </button>

            <div class="auth-links">
                <p>Already have an account? <a href="{{ url_for('login') }}">Sign In</a></p>
                <p style="margin-top:0.5rem;"><a href="{{ url_for('index') }}">← Back to Home</a></p>
            </div>
        </div>
    </div>

    <script>
    function checkStrength(pw) {
        let s = 0;
        if (pw.length >= 8) s++;
        if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++;
        if (/[0-9]/.test(pw)) s++;
        if (/[^a-zA-Z0-9]/.test(pw)) s++;
        const colours = ['#ef4444','#f59e0b','#eab308','#22c55e'];
        const labels = ['Weak','Fair','Good','Strong'];
        document.getElementById('strength-fill').style.width = (s * 25) + '%';
        document.getElementById('strength-fill').style.background = colours[s - 1] || '#f0f0f0';
        document.getElementById('strength-label').textContent = s > 0 ? labels[s - 1] : '';
    }

    function handleRegister() {
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm_password').value;

        if (!username || !email || !password || !confirm) { alert('Please fill in all fields'); return; }
        if (password.length < 8) { alert('Password must be at least 8 characters'); return; }
        if (password !== confirm) { alert('Passwords do not match'); return; }

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = "{{ url_for('register') }}";
        [['_csrf_token', '{{ csrf_token() }}'], ['username', username], ['email', email], ['password', password], ['confirm_password', confirm]].forEach(([n, v]) => {
            const i = document.createElement('input');
            i.type = 'hidden'; i.name = n; i.value = v;
            form.appendChild(i);
        });
        document.body.appendChild(form);
        form.submit();
    }
    document.addEventListener('keypress', e => { if (e.key === 'Enter') handleRegister(); });
    </script>
</body>
</html>
